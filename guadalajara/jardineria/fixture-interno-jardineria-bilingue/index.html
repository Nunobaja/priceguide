<body>
<div class="wrap" id="app"></div>
<script>
(function loadAppShell() {
  const rootSegment = "priceguide";
  const segments = window.location.pathname.split("/").filter(Boolean);
  const candidates = segments[0] && segments[0].toLowerCase() === rootSegment
    ? ["/" + rootSegment, ""]
    : [""];

  function loadScript(src, onload, onerror) {
    const script = document.createElement("script");
    script.src = src;
    script.onload = onload;
    script.onerror = onerror;
    document.head.appendChild(script);
  }

  function showLoadError() {
    const app = document.getElementById("app");
    app.innerHTML = "<p>No se pudo cargar la guía de precios. Recarga la página para intentar de nuevo.</p>";
  }

  function loadFrom(index) {
    const base = candidates[index];
    if (base === undefined) {
      showLoadError();
      return;
    }

    loadScript(base + "/businesses.js", function () {
      loadScript(base + "/app.js", null, function () {
        loadFrom(index + 1);
      });
    }, function () {
      loadFrom(index + 1);
    });
  }

  loadFrom(0);
})();
</script>
</body>
